        <nav class="navbar navbar-expand-lg fixed-top custom-navbar" role="navigation" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">AB</a>

                    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">

                        <i class="bi bi-sun-fill theme-icon theme-icon-sun" aria-hidden="true"></i>
                    </button>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                        <svg class="hamburger-icon" xmlns="http://www.w3.org/2000/svg" width="1.25em" height="1.25em" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" fill-rule="evenodd" d="M19.75 12a.75.75 0 0 0-.75-.75H5a.75.75 0 0 0 0 1.5h14a.75.75 0 0 0 .75-.75m0-5a.75.75 0 0 0-.75-.75H5a.75.75 0 0 0 0 1.5h14a.75.75 0 0 0 .75-.75m0 10a.75.75 0 0 0-.75-.75H5a.75.75 0 0 0 0 1.5h14a.75.75 0 0 0 .75-.75" clip-rule="evenodd" />

                <div class="collapse navbar-collapse" id="mainNavbar">

    <main id="main-content" tabindex="-1">
        <section class="page-header">
            <div class="container">
                <p class="section-label">Contact</p>
                <h1>Send a Message</h1>
                <p>Use the form below to test live JavaScript validation and feedback.</p>
            </div>
        </section>

        <section class="section-padding">
            <div class="container">
                <div class="row g-5">
                    <div class="col-12">
                        <div class="contact-form-wrapper">
                            <form class="contact-form" id="contactForm" novalidate>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name" name="name" autocomplete="name" placeholder="Enter your name" aria-describedby="nameError">
                                    <small class="error-message" id="nameError"></small>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" autocomplete="email" placeholder="Enter your email" aria-describedby="emailError">
                                    <small class="error-message" id="emailError"></small>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Message</label>
                                    <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message" aria-describedby="messageError"></textarea>
                                    <small class="error-message" id="messageError"></small>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg">Submit message</button>
                                <div class="form-status mt-3" id="formStatus" role="status" aria-live="polite"></div>
                            </form>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Aakash Bhusal. Portfolio Website.</p>
        </div>
